name: Scientific Engine CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  # Mandatory Scientific-Engine CI Sequence per System Design Section 100:
  # Python lint -> type checks -> unit tests -> scientific regression suite ->
  # golden dataset tests -> container build -> SBOM -> vulnerability scan -> benchmark
  scientific-engine-pipeline:
    name: Scientific Engine Validation Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Gate 0 — Verify Contract Authority
        run: |
          python scripts/sync_contracts.py --check

      - name: Install Locked Dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements-dev-lock.txt
          pip install --no-cache-dir --no-deps -e .

      - name: Gate 1 — Python Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Gate 2 — Type Checks
        run: |
          mypy cellweave_science modal_app tests benchmarks

      - name: Gate 3 — Unit Tests
        run: |
          pytest -v --strict-markers -m "unit"

      - name: Gate 4 — Scientific Regression Suite
        run: |
          pytest -v --strict-markers -m "regression"

      - name: Gate 5 — Golden Dataset Tests
        run: |
          pytest -v --strict-markers -m "golden"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Gate 6 — Container Build
        run: |
          docker build -t cellweave-science:ci .

      - name: Gate 7 — Software Bill of Materials (SBOM)
        run: |
          cyclonedx-py requirements requirements-lock.txt -o sbom.json
          head -n 35 sbom.json

      - name: Gate 8 — Vulnerability Scan
        run: |
          pip-audit -r requirements-lock.txt

      - name: Gate 9 — Scientific Benchmark
        run: |
          pytest -v --strict-markers -m "benchmark"
          python -c "from benchmarks.harness import BenchmarkRunner, BenchmarkTier; res = BenchmarkRunner.profile_routine(BenchmarkTier.TIER_10K, lambda: None); print('Benchmark Smoke Gate Passed:', res)"
