name: Scientific Engine CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install build and quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install hatchling ruff mypy pytest pytest-mock pytest-cov pydantic structlog

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Formatting Check
        run: ruff format --check .

      - name: Strict Type Check (mypy)
        run: mypy cellweave_science modal_app tests benchmarks

      - name: Run Pytest Suite
        run: pytest -v --strict-markers -m "unit or golden or benchmark"

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for known CVEs
        run: pip-audit
        continue-on-error: true
