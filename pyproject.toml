[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellweave-science"
version = "0.1.0"
description = "CellWeave downstream scientific compute engine and artifact generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "CellWeave Engineering" }
]
keywords = ["single-cell", "bioinformatics", "anndata", "scanpy", "scrna-seq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<1.14.0",
    "pandas>=2.1.0,<3.0.0",
    "anndata>=0.10.0,<0.12.0",
    "scanpy>=1.9.0,<1.11.0",
    "structlog>=24.1.0,<25.0.0",
    "modal>=0.62.0,<1.0.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cellweave_science", "modal_app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line-length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["cellweave_science", "modal_app"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "anndata.*",
    "scanpy.*",
    "scipy.*",
    "sklearn.*",
    "modal.*",
    "scrublet.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Quick unit tests without external resources",
    "golden: Golden dataset verification tests",
    "benchmark: Performance and resource benchmark tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
